site_name: OhMyDebn
site_url: https://ohmydebn.org/
site_dir: dist
repo_url: https://github.com/dougburks/ohmydebn

watch:
  - overrides

plugins:
  - glightbox
  - search

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.footer
  palette:
    scheme: slate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Motivation: motivation.md
  - Gallery: gallery.md
  - Ingredients: ingredients.md
  - FAQ: faq.md
  - Requirements: requirements.md
  - Warnings: warnings.md
  - Source Code: source-code.md
  - Installation: installation.md
  - Menus: menus.md
  - Desktop Themes: desktop-themes.md
  - Desktop Effects: desktop-effects.md
  - Screen Magnifier: screen-magnifier.md
  - Window Tiling: window-tiling.md
  - Browser: browser.md
  - AI: ai.md
  - Text Editor: text-editor.md
  - Documents: documents.md
  - Terminal: terminal.md
  - Password Manager: password-manager.md
  - Utilities: utilities.md
  - Firewall: firewall.md
  - VPN: vpn.md
  - Virtualization: virtualization.md
  - Containerization: containerization.md
  - Cybersecurity: cybersecurity.md
  - Media: media.md
  - Updating: updating.md
  - Release Notes: release-notes.md
  - Resetting: resetting.md
  - Hotkeys: hotkeys.md
  - Acknowledgements: acknowledgements.md
